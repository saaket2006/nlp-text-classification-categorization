project_name: "Tri-Tiered Local LLM AL Framework"
seed: 42

tier1:
  model_name: "distilbert-base-uncased"
  max_length: 128
  batch_size: 16
  threshold_entropy: 0.65  # tau_1 (Slightly more aggressive Tier 1)
  threshold_confidence: 0.5 # tau_2 (Trust LLM reasoning more)
  active_learning_batch_size: 4
  pretrain_epochs: 3

tier2:
  ollama_model: "qwen2.5:3b"
  url: "http://localhost:11434"
  categories: ["World", "Sports", "Business", "Sci/Tech"]

tier3:
  human_error_rate: 0.05

data:
  dataset_name: "ag_news"
  train_samples: 1000
  test_samples: 200

paths:
  logs_dir: "./logs"
  metrics_file: "./logs/metrics_summary.json"
  report_file: "./logs/research_report.md"
  sweep_file: "./logs/threshold_sweep.json"
